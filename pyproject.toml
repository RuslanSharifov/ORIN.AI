[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orin-ai"
version = "0.6.0"
description = "Local-first, extensible personal AI assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8", "python-dotenv>=1,<2", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
orin = "orin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
